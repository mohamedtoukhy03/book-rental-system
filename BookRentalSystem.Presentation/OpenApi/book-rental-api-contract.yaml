openapi: 3.1.0
info:
  title: Book Rental System API
  version: 1.0.0
  summary: API contract for the Book Rental System
  contact:
    name: Book Rental System API Team
tags:
  - name: Users
  - name: Admins
  - name: Books
  - name: RentalRequests

security: []

paths:
  /api/user/register:
    post:
      tags: [Users]
      operationId: registerUser
      summary: Register a normal user
      description: Registers a User. Clients cannot choose a role.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterUserRequest'
            example:
              userName: Ahmed Mohamed
              email: ahmed@example.com
              password: Password123!
      responses:
        '201':
          description: User registered successfully.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'

  /api/user/login:
    post:
      tags: [Users]
      operationId: loginUser
      summary: Log in a user
      description: Returns a JWT for valid credentials.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: ahmed@example.com
              password: Password123!
      responses:
        '200':
          description: Authentication succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'

  /api/user/{id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Users]
      operationId: getUserById
      summary: Get a user by ID
      description: Users may retrieve their own profile; SuperAdmins may retrieve any profile.
      security:
        - BearerAuth: []
      x-required-roles: [User, Admin, SuperAdmin]
      responses:
        '200':
          description: User found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '403':
          $ref: '#/components/responses/ForbiddenProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
    patch:
      tags: [Users]
      operationId: updateUser
      summary: Update a user profile
      description: Users may update their own profile. Role and password cannot be changed here.
      security:
        - BearerAuth: []
      x-required-roles: [User, Admin, SuperAdmin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: User profile updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '403':
          $ref: '#/components/responses/ForbiddenProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'
    delete:
      tags: [Users]
      operationId: deactivateUser
      summary: Deactivate a user account
      description: Deactivates the account while preserving rental history.
      security:
        - BearerAuth: []
      x-required-roles: [SuperAdmin]
      responses:
        '204':
          description: User account deactivated.
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '403':
          $ref: '#/components/responses/ForbiddenProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'

  /api/admin:
    post:
      tags: [Admins]
      operationId: createAdmin
      summary: Create an administrator account
      description: The server assigns the Admin role; clients cannot assign SuperAdmin.
      security:
        - BearerAuth: []
      x-required-roles: [SuperAdmin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAdminRequest'
            example:
              userName: Mohamed Ali
              email: mohamed@example.com
              password: TemporaryPassword123!
      responses:
        '201':
          description: Administrator account created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminResponse'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '403':
          $ref: '#/components/responses/ForbiddenProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'

  /api/admin/{id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Admins]
      operationId: getAdminById
      summary: Get an administrator by ID
      security:
        - BearerAuth: []
      x-required-roles: [SuperAdmin]
      responses:
        '200':
          description: Administrator found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '403':
          $ref: '#/components/responses/ForbiddenProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
    patch:
      tags: [Admins]
      operationId: updateAdmin
      summary: Update an administrator profile
      description: Role changes are not allowed here.
      security:
        - BearerAuth: []
      x-required-roles: [SuperAdmin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Administrator updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminResponse'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '403':
          $ref: '#/components/responses/ForbiddenProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'
    delete:
      tags: [Admins]
      operationId: deactivateAdmin
      summary: Deactivate an administrator account
      description: The seeded SuperAdmin cannot be deactivated.
      security:
        - BearerAuth: []
      x-required-roles: [SuperAdmin]
      responses:
        '204':
          description: Administrator account deactivated.
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '403':
          $ref: '#/components/responses/ForbiddenProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'

  /api/book:
    post:
      tags: [Books]
      operationId: createBook
      summary: Add a book
      description: AvailableCopies is initialized to TotalCopies.
      security:
        - BearerAuth: []
      x-required-roles: [Admin, SuperAdmin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookRequest'
            example:
              title: Clean Code
              author: Robert C. Martin
              isbn: '9780132350884'
              totalCopies: 5
      responses:
        '201':
          description: Book created successfully.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookResponse'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '403':
          $ref: '#/components/responses/ForbiddenProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'

  /api/book/all:
    get:
      tags: [Books]
      operationId: getAllBooks
      summary: Get all books
      security: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Books returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookListResponse'

  /api/book/available:
    get:
      tags: [Books]
      operationId: getAvailableBooks
      summary: Get books with available copies
      security: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Available books returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookListResponse'

  /api/book/{id}:
    parameters:
      - $ref: '#/components/parameters/BookId'
    get:
      tags: [Books]
      operationId: getBookById
      summary: Get a book by ID
      security: []
      responses:
        '200':
          description: Book found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookResponse'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
    patch:
      tags: [Books]
      operationId: updateBook
      summary: Update a book
      description: AvailableCopies is server-managed; TotalCopies cannot be reduced below allocated copies.
      security:
        - BearerAuth: []
      x-required-roles: [Admin, SuperAdmin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBookRequest'
      responses:
        '200':
          description: Book updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookResponse'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '403':
          $ref: '#/components/responses/ForbiddenProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'
    delete:
      tags: [Books]
      operationId: archiveBook
      summary: Archive a book
      description: Archives the book to preserve rental history.
      security:
        - BearerAuth: []
      x-required-roles: [Admin, SuperAdmin]
      responses:
        '204':
          description: Book archived successfully.
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '403':
          $ref: '#/components/responses/ForbiddenProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'

  /api/rental-request:
    post:
      tags: [RentalRequests]
      operationId: createRentalRequest
      summary: Request to rent a book
      description: Creates a Pending request for the authenticated User. UserId is token-derived; availability changes on approval.
      security:
        - BearerAuth: []
      x-required-roles: [User]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRentalRequest'
            example:
              bookId: 1
      responses:
        '201':
          description: Rental request created with Pending status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RentalRequestResponse'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '403':
          $ref: '#/components/responses/ForbiddenProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '409':
          description: No copies are available or a Pending request already exists for this user and book.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/rental-request/all:
    get:
      tags: [RentalRequests]
      operationId: getAllRentalRequests
      summary: Get all rental requests
      security:
        - BearerAuth: []
      x-required-roles: [Admin, SuperAdmin]
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/RentalRequestStatus'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Rental requests returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminRentalRequestListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '403':
          $ref: '#/components/responses/ForbiddenProblem'

  /api/rental-request/pending:
    get:
      tags: [RentalRequests]
      operationId: getPendingRentalRequests
      summary: Get pending rental requests
      security:
        - BearerAuth: []
      x-required-roles: [Admin, SuperAdmin]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Pending rental requests returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminRentalRequestListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '403':
          $ref: '#/components/responses/ForbiddenProblem'

  /api/rental-request/user/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        description: Identity user ID.
        schema:
          type: string
    get:
      tags: [RentalRequests]
      operationId: getRentalRequestsByUserId
      summary: Get rental requests for a user
      security:
        - BearerAuth: []
      x-required-roles: [Admin, SuperAdmin]
      responses:
        '200':
          description: User rental requests returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RentalRequestListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '403':
          $ref: '#/components/responses/ForbiddenProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'

  /api/rental-request/my:
    get:
      tags: [RentalRequests]
      operationId: getMyRentalRequests
      summary: Get the authenticated user's rental requests
      description: Returns the authenticated User's requests with their current status.
      security:
        - BearerAuth: []
      x-required-roles: [User]
      responses:
        '200':
          description: Current user's rental requests returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RentalRequestListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '403':
          $ref: '#/components/responses/ForbiddenProblem'

  /api/rental-request/approve/{id}:
    parameters:
      - $ref: '#/components/parameters/RentalRequestId'
    patch:
      tags: [RentalRequests]
      operationId: approveRentalRequest
      summary: Approve a rental request
      description: Approves a Pending request, records the reviewer's ID, and atomically decrements AvailableCopies.
      security:
        - BearerAuth: []
      x-required-roles: [Admin, SuperAdmin]
      responses:
        '200':
          description: Rental request approved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RentalRequestReviewResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '403':
          $ref: '#/components/responses/ForbiddenProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '409':
          description: Request is no longer Pending or no copies remain available.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/rental-request/reject/{id}:
    parameters:
      - $ref: '#/components/parameters/RentalRequestId'
    patch:
      tags: [RentalRequests]
      operationId: rejectRentalRequest
      summary: Reject a rental request
      description: Rejects a Pending request, records the reviewer's ID, and leaves AvailableCopies unchanged.
      security:
        - BearerAuth: []
      x-required-roles: [Admin, SuperAdmin]
      responses:
        '200':
          description: Rental request rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RentalRequestReviewResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '403':
          $ref: '#/components/responses/ForbiddenProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '409':
          description: Request is no longer Pending.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/rental-request/{id}:
    parameters:
      - $ref: '#/components/parameters/RentalRequestId'
    get:
      tags: [RentalRequests]
      operationId: getRentalRequestById
      summary: Get a rental request by ID
      description: Users may retrieve their own requests; Admins may retrieve any request.
      security:
        - BearerAuth: []
      x-required-roles: [User, Admin, SuperAdmin]
      responses:
        '200':
          description: Rental request found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RentalRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '403':
          $ref: '#/components/responses/ForbiddenProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    UserId:
      name: id
      in: path
      required: true
      description: ASP.NET Core Identity user ID.
      schema:
        type: string
    BookId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int32
        minimum: 1
    RentalRequestId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int32
        minimum: 1
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  schemas:
    RegisterUserRequest:
      type: object
      additionalProperties: false
      required: [userName, email, password]
      properties:
        userName:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 256
        password:
          type: string
          format: password
          minLength: 8
          writeOnly: true
          description: Must meet the configured Identity password policy.

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          writeOnly: true

    UpdateUserRequest:
      type: object
      additionalProperties: false
      required: [userName, email]
      properties:
        userName:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 256

    CreateAdminRequest:
      type: object
      additionalProperties: false
      required: [userName, email, password]
      properties:
        userName:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 256
        password:
          type: string
          format: password
          minLength: 8
          writeOnly: true
          description: Temporary password.

    UserResponse:
      type: object
      required: [id, userName, email, role]
      properties:
        id:
          type: string
        userName:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/UserRole'

    AdminResponse:
      allOf:
        - $ref: '#/components/schemas/UserResponse'
        - type: object
          properties:
            role:
              type: string
              const: Admin

    LoginResponse:
      type: object
      required: [accessToken, expiresAt, user]
      properties:
        accessToken:
          type: string
        expiresAt:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/UserResponse'

    UserRole:
      type: string
      enum: [User, Admin, SuperAdmin]

    CreateBookRequest:
      type: object
      additionalProperties: false
      required: [title, author, isbn, totalCopies]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 250
        author:
          type: string
          minLength: 1
          maxLength: 200
        isbn:
          type: string
          minLength: 10
          maxLength: 17
          description: Unique ISBN-10 or ISBN-13.
        totalCopies:
          type: integer
          format: int32
          minimum: 1
          description: Initial stock; AvailableCopies is initialized to this value.

    UpdateBookRequest:
      type: object
      additionalProperties: false
      required: [title, author, isbn, totalCopies]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 250
        author:
          type: string
          minLength: 1
          maxLength: 200
        isbn:
          type: string
          minLength: 10
          maxLength: 17
        totalCopies:
          type: integer
          format: int32
          minimum: 1
          description: AvailableCopies is server-managed and cannot be set by clients.

    BookResponse:
      type: object
      required: [id, title, author, isbn, totalCopies, availableCopies]
      properties:
        id:
          type: integer
          format: int32
        title:
          type: string
        author:
          type: string
        isbn:
          type: string
        totalCopies:
          type: integer
          format: int32
        availableCopies:
          type: integer
          format: int32
          minimum: 0
          description: Copies currently available to rent; zero means unavailable.

    BookListResponse:
      type: array
      items:
        $ref: '#/components/schemas/BookResponse'

    CreateRentalRequest:
      type: object
      additionalProperties: false
      required: [bookId]
      properties:
        bookId:
          type: integer
          format: int32
          minimum: 1
      description: UserId is derived from the authenticated user.

    RentalRequestStatus:
      type: string
      enum: [Pending, Approved, Rejected]

    RentalRequestResponse:
      type: object
      required: [id, userId, bookId, bookTitle, requestedAt, status, reviewedByUserId]
      properties:
        id:
          type: integer
          format: int32
        userId:
          type: string
        bookId:
          type: integer
          format: int32
        bookTitle:
          type: string
        requestedAt:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/RentalRequestStatus'
        reviewedByUserId:
          type: [string, 'null']
          description: ID of the reviewing Admin or SuperAdmin; null until reviewed.

    AdminRentalRequestResponse:
      allOf:
        - $ref: '#/components/schemas/RentalRequestResponse'
        - type: object
          required: [userName]
          properties:
            userName:
              type: string
            userEmail:
              type: string
              format: email

    RentalRequestListResponse:
      type: array
      items:
        $ref: '#/components/schemas/RentalRequestResponse'

    AdminRentalRequestListResponse:
      type: array
      items:
        $ref: '#/components/schemas/AdminRentalRequestResponse'

    RentalRequestReviewResponse:
      type: object
      required: [id, status, reviewedByUserId]
      properties:
        id:
          type: integer
          format: int32
        status:
          type: string
          enum: [Approved, Rejected]
        reviewedByUserId:
          type: string

    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      additionalProperties: true

  responses:
    ValidationProblem:
      description: Validation failed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    UnauthorizedProblem:
      description: Authentication is missing or invalid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ForbiddenProblem:
      description: Insufficient permission.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFoundProblem:
      description: Resource not found.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ConflictProblem:
      description: Conflict with the current state or a unique value.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
